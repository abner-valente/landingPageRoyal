<style>
  :root{
    --navy-950:#060D18;
    --navy-900:#0A1626;
    --navy-800:#102640;
    --navy-700:#1c3557;
    --gold:#D4AF37;
    --gold-light:#F0D778;
    --cream:#F5F1E6;
    --slate:#93A1B8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--navy-950);
    color:var(--cream);
    font-family:'Manrope',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
  }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  .bg-noise{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.05;
    background-image:radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
    background-size:26px 26px;
  }
  main{
    position:relative; z-index:1;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:56px 24px 40px;
    max-width:720px; margin:0 auto;
  }
  .logo{height:46px; width:auto; margin-bottom:44px;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-size:12px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold-light); font-weight:700; margin-bottom:20px;
  }
  .eyebrow::before, .eyebrow::after{content:""; width:26px; height:1px; background:var(--navy-700);}
  h1{
    font-family:'Fraunces',serif; font-weight:500;
    font-size:clamp(28px,5vw,44px); line-height:1.15;
    margin-bottom:20px;
  }
  h1 em{font-style:italic; color:var(--gold-light);}
  .lead{color:var(--slate); font-size:16px; max-width:480px; margin:0 auto 34px;}
  @media (max-width:560px){
    .logo{height:38px; margin-bottom:34px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important;}
  }
</style>
</head>
