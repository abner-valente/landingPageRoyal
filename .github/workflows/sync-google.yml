name: Sincroniza avaliações do Google

on:
  # AGENDAMENTO DESLIGADO.
  # A leitura automatica depende da Places API, que exige conta de faturamento
  # no Google Cloud -- e criar essa conta pede um pre-pagamento. Enquanto isso
  # nao existir, deixar o cron ligado so produziria erro 403 e um e-mail de
  # falha por dia, sem nunca atualizar nada.
  #
  # Para religar quando o faturamento estiver resolvido:
  #   1. descomente as duas linhas de schedule abaixo
  #   2. volte o campo "total" para required: false
  # Ai o campo vazio passa a significar "leia do Google".
  #
  # schedule:
  #   - cron: "0 9 * * *"   # 09:00 UTC = 06:00 em Brasília (UTC-3, sem horário de verão)
  workflow_dispatch: # rodar na mão pelo painel do GitHub
    inputs:
      total:
        # Obrigatorio: em modo manual, campo vazio tentaria ler do Google e
        # bateria no 403. Sem valor padrao, o proprio GitHub barra o envio.
        description: "Total de avaliações que aparece no Google (ex: 292)"
        required: true
      nota:
        description: "Nota — deixe vazio para manter a atual (ex: 5,0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-google
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consulta o Google e atualiza o index.html
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          # Preenchidos só quando alguém dispara na mão informando os números.
          ROYAL_COUNT: ${{ inputs.total }}
          ROYAL_RATING: ${{ inputs.nota }}
        run: python scripts/sync_google.py

      - name: Publica se algo mudou
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou; nenhum commit criado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dados-google.json
          git commit -m "Atualiza nota e numero de avaliacoes do Google"
          git push
