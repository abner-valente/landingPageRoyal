name: Sincroniza avaliações do Google

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília. Cron do GitHub sempre roda em UTC, e o
    # Brasil nao tem mais horario de verao, entao a conta e fixa (UTC-3).
    # O GitHub pode atrasar execucoes agendadas em horarios de pico; o
    # numero de avaliacoes nao muda de minuto em minuto, entao tudo bem.
    - cron: "0 9 * * *"
  workflow_dispatch: # rodar na mão pelo painel do GitHub
    inputs:
      total:
        # Opcional de novo agora que existe chave da API: em branco significa
        # "leia do Google", que e uma acao util. Se faltar a chave, o script
        # falha explicando, em vez de terminar em verde sem fazer nada.
        description: "Total de avaliações — deixe VAZIO para ler do Google"
        required: false
        default: ""
      nota:
        description: "Nota — deixe vazio para manter a atual (ex: 5,0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-google
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consulta o Google e atualiza o index.html
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          # Preenchidos só quando alguém dispara na mão informando os números.
          ROYAL_COUNT: ${{ inputs.total }}
          ROYAL_RATING: ${{ inputs.nota }}
        run: python scripts/sync_google.py

      - name: Publica se algo mudou
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou; nenhum commit criado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dados-google.json
          git commit -m "Atualiza nota e numero de avaliacoes do Google"
          git push
