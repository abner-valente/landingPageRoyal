name: Sincroniza avaliações do Google

on:
  schedule:
    # 09:20 UTC = 06:20 em Brasília. Cron do GitHub sempre roda em UTC.
    - cron: "20 9 * * *"
  workflow_dispatch: # rodar na mão pelo painel do GitHub
    inputs:
      total:
        # Obrigatorio e sem valor padrao de proposito: assim o GitHub nao
        # deixa disparar em branco. Enquanto nao existe chave da API, o modo
        # manual e o unico que funciona, entao o campo sempre precisa vir
        # preenchido. Quando a chave existir, da para torna-lo opcional de
        # novo para permitir forcar uma leitura do Google na mao.
        description: "Total de avaliações que aparece no Google (ex: 291)"
        required: true
      nota:
        description: "Nota — deixe vazio para manter a atual (ex: 5,0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-google
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consulta o Google e atualiza o index.html
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          # Preenchidos só quando alguém dispara na mão informando os números.
          ROYAL_COUNT: ${{ inputs.total }}
          ROYAL_RATING: ${{ inputs.nota }}
        run: python scripts/sync_google.py

      - name: Publica se algo mudou
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou; nenhum commit criado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dados-google.json
          git commit -m "Atualiza nota e numero de avaliacoes do Google"
          git push
